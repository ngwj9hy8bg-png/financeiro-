<div class="app">

  <div><div class="nav-label">Principal</div><nav class="nav" id="sideNav"></nav></div>
  
</aside>
<main class="main">
  <header class="topbar">
    <div><div class="eyebrow" id="pageEyebrow">SEU ESPAÇO FINANCEIRO</div><h1 class="page-title" id="pageTitle">Visão geral</h1></div>
    <div class="top-actions">
      <button class="settings-text" id="settingsBtn" title="Configurações">Configurações</button>
      <button class="profile-btn" id="profileBtn" title="Editar perfil"><img class="avatar" id="topAvatar" alt="Foto de perfil"><span><span class="profile-name" id="topName">Meu perfil</span><span class="profile-sub">Meu espaço</span></span></button>
    </div>
  </header>
  <div class="content" id="view"></div>
</main>
</div>

<div class="toast" id="toast" role="status"></div>
<input id="avatarFile" type="file" accept="image/*" class="hidden">
<input id="productFile" type="file" accept="image/*" class="hidden">
<script>
(() => {
'use strict';
const KEY='ribeiro_financas_v1';
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((Number(n)||0)/100);
const toCents=v=>{let s=String(v??'').trim();if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=Number(s);return Number.isFinite(n)?Math.round(n*100):0};
const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthNow=()=>today().slice(0,7);
const blank=()=>({profile:{name:'Meu perfil',avatar:'',hide:false},openingBalance:0,transactions:[],debts:[],receivables:[],sales:[],vault:{balance:0,history:[]},goals:[],categories:{in:['Salário','Renda extra','Venda de produtos','Recebimento de empréstimo','Recebimento de dívida','Outros'],out:['Alimentação','Contas da casa','Transporte','Saúde','Compras pessoais','Família','Pagamento de dívidas','Outros']},settings:{currency:'BRL'},createdAt:Date.now()});
let db=load(), page='home', modalAction=null, tempProductImage='', activeMonth=monthNow(), toastTimer;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?({...blank(),...x,profile:{...blank().profile,...x.profile},vault:{...blank().vault,...x.vault},settings:{...blank().settings,...x.settings}}):blank()}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify('Não foi possível salvar. A imagem pode ser grande demais.');return false}}
function notify(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
const navItems=[['home','','Início'],['debts','','Minhas dívidas'],['receivables','','Empréstimos'],['sales','','Vendas de produtos']];
const sideItems=navItems;
function nav(){const btn=(it)=>`<button data-page="${it[0]}" class="${page===it[0]?'active':''}">${it[2]}</button>`;$('#sideNav').innerHTML=sideItems.map(btn).join('');$('#bottomNav').innerHTML=navItems.map(it=>`<button data-page="${it[0]}" class="${page===it[0]?'active':''}">${it[2]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));}
function go(p){page=p;nav();render();window.scrollTo({top:0,behavior:'smooth'})}
function allEvents(){return [...db.transactions.map(t=>({...t,kind:'transaction'})),...db.debts.flatMap(d=>(d.payments||[]).map(p=>({...p,kind:'debtpay',parentId:d.id,description:'Pagamento — '+d.person}))),...db.receivables.flatMap(r=>(r.payments||[]).map(p=>({...p,kind:'receivablepay',parentId:r.id,description:'Recebimento — '+r.person}))),...db.sales.flatMap(s=>(s.payments||[]).map(p=>({...p,kind:'salepay',parentId:s.id,description:'Venda — '+s.product}))),...db.vault.history.map(h=>({...h,kind:'vault'})),...db.goals.flatMap(g=>(g.history||[]).map(h=>({...h,kind:'goal',parentId:g.id,description:(h.type==='add'?'Meta — ':'Retirada da meta — ')+g.name})))];}
function received(){return db.transactions.filter(t=>t.type==='in'&&!t.internal).reduce((s,t)=>s+t.amount,0)+db.receivables.reduce((s,r)=>s+(r.payments||[]).reduce((a,p)=>a+p.amount,0),0)+db.sales.reduce((s,x)=>s+(x.payments||[]).reduce((a,p)=>a+p.amount,0),0)}
function paidOut(){return db.transactions.filter(t=>t.type==='out'&&!t.internal).reduce((s,t)=>s+t.amount,0)+db.debts.reduce((s,d)=>s+(d.payments||[]).reduce((a,p)=>a+p.amount,0),0)}
function reservedGoals(){return db.goals.reduce((s,g)=>s+g.saved,0)}
function available(){return db.openingBalance+received()-paidOut()-db.vault.balance-reservedGoals()}
function totals(){const outstandingDebts=db.debts.reduce((s,d)=>s+Math.max(0,d.total-d.paid),0),outstandingRec=db.receivables.reduce((s,r)=>s+Math.max(0,r.total-r.received),0)+db.sales.filter(s=>s.status!=='cancelled').reduce((s,x)=>s+Math.max(0,x.price-x.received),0);return {available:available(),vault:db.vault.balance,receivable:outstandingRec,debts:outstandingDebts,expenses:db.transactions.filter(t=>t.type==='out'&&!t.internal&&t.date.slice(0,7)===monthNow()).reduce((s,t)=>s+t.amount,0)+db.debts.reduce((s,d)=>s+(d.payments||[]).filter(p=>p.date.slice(0,7)===monthNow()).reduce((a,p)=>a+p.amount,0),0),income:db.transactions.filter(t=>t.type==='in'&&!t.internal&&t.date.slice(0,7)===monthNow()).reduce((s,t)=>s+t.amount,0)+db.receivables.reduce((s,r)=>s+(r.payments||[]).filter(p=>p.date.slice(0,7)===monthNow()).reduce((a,p)=>a+p.amount,0),0)+db.sales.reduce((s,x)=>s+(x.payments||[]).filter(p=>p.date.slice(0,7)===monthNow()).reduce((a,p)=>a+p.amount,0),0)}}
function moneyView(n){return db.profile.hide?'••••••••':money(n)}
function statusDebt(d){return d.paid>=d.total?'Quitada':d.paid>0?'Parcialmente paga':d.due&&d.due<today()?'Atrasada':'Pendente'}
function statusRec(r){return r.received>=r.total?'Recebido':r.received>0?'Parcialmente recebido':r.due&&r.due<today()?'Atrasado':'A receber'}
function statusSale(s){return s.status==='cancelled'?'Cancelado':s.received>=s.price?'Pago':s.received>0?'Parcialmente recebido':s.status==='listed'?'Anunciado':'Vendido e não recebido'}
function pill(text){let c=/Quitada|Recebido|Pago|Concluída/.test(text)?'green':/Atrasad|Cancelado/.test(text)?'red':/Parcial|próxim/.test(text)?'amber':'';return `<span class="pill ${c}">${safe(text)}</span>`}
function empty(icon,title,desc,button,label){return `<div class="empty"><strong>${title}</strong><p>${desc}</p>${button?`<button class="btn btn-primary btn-small" data-action="${button}">${label||'Adicionar primeiro registro'}</button>`:''}</div>`}
function header(title,desc,button,label){return `<div class="section-head"><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${button?`<button class="btn btn-primary btn-small" data-action="${button}">＋ ${label||'Adicionar'}</button>`:''}</div>`}
function stat(label,val,icon,foot=''){return `<div class="card stat-card"><div class="stat-top"><span>${label}</span></div><div class="stat-value">${moneyView(val)}</div>${foot?`<div class="stat-foot">${foot}</div>`:''}</div>`}
function row(icon,title,sub,value,type='neutral'){return `<div class="list-row"><div class="row-main"><div class="row-title">${safe(title)}</div><div class="row-sub">${safe(sub)}</div></div><div class="row-value ${type==='in'?'positive':type==='out'?'negative':''}">${type==='in'?'+ ':type==='out'?'- ':''}${moneyView(value)}</div></div>`}
function render(){const titles={home:['SEU ESPAÇO FINANCEIRO','Visão geral'],debts:['ORGANIZE SUAS OBRIGAÇÕES','Minhas dívidas'],receivables:['ACOMPANHE SEUS RECEBIMENTOS','Dinheiro a receber'],sales:['SUAS VENDAS EM UM SÓ LUGAR','Minhas vendas'],vault:['GUARDE UM POUCO DE CADA VEZ','Meu cofrinho'],goals:['SEUS PLANOS, SEU RITMO','Minhas metas'],transactions:['CADA MOVIMENTAÇÃO CONTA','Movimentações'],summary:['ENTENDA SEU DINHEIRO','Resumo financeiro'],calendar:['NÃO PERCA NENHUMA DATA','Calendário financeiro'],profile:['DO SEU JEITO','Perfil'],settings:['PREFERÊNCIAS DO RIBEIRO','Configurações']};$('#pageEyebrow').textContent=(titles[page]||titles.home)[0];$('#pageTitle').textContent=(titles[page]||titles.home)[1];$('#topName').textContent=db.profile.name||'Meu perfil';$('#topAvatar').src=db.profile.avatar||avatarPlaceholder();let fn={home:homePage,debts:debtsPage,receivables:receivablesPage,sales:salesPage,vault:vaultPage,goals:goalsPage,transactions:transactionsPage,summary:summaryPage,calendar:calendarPage,profile:profilePage,settings:settingsPage};$('#view').innerHTML=(fn[page]||homePage)();wireActions();}
function avatarPlaceholder(){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" rx="40" fill="#dce6f4"/><circle cx="40" cy="30" r="14" fill="#7395c5"/><path d="M14 75c2-19 12-28 26-28s24 9 26 28" fill="#7395c5"/></svg>')}
function homePage(){const t=totals();return `
<section class="balance-card compact-balance"><div class="balance-head"><span class="balance-label">SALDO DISPONÍVEL PARA GASTAR</span><button class="privacy-text" id="togglePrivacy">${db.profile.hide?'Mostrar':'Ocultar'} saldo</button></div><div class="balance-amount">${moneyView(t.available)}</div><div class="balance-bottom"><div class="mini-stat"><span>Total das minhas dívidas</span><strong>${moneyView(t.debts)}</strong></div><div class="mini-stat"><span>Tenho para receber</span><strong>${moneyView(t.receivable)}</strong></div></div><div class="balance-actions"><button class="btn btn-light btn-small" data-action="addMoney">Adicionar dinheiro</button><button class="btn btn-small" data-action="expense" style="background:#ffffff1c;color:white">Registrar gasto</button></div></section>
<div class="section-head compact-head"><div><h2>Controle financeiro</h2><p>Escolha o que deseja organizar.</p></div></div>
<div class="simple-links"><button class="simple-link" data-page="debts"><strong>Minhas dívidas</strong><span>O que preciso pagar</span><b>${moneyView(t.debts)}</b></button><button class="simple-link" data-page="receivables"><strong>Empréstimos</strong><span>Dinheiro emprestado a pessoas</span><b>${moneyView(db.receivables.reduce((a,r)=>a+Math.max(0,r.total-r.received),0))}</b></button><button class="simple-link" data-page="sales"><strong>Vendas de produtos</strong><span>Quem ainda me deve por uma venda</span><b>${moneyView(db.sales.filter(x=>x.status!=='cancelled').reduce((a,x)=>a+Math.max(0,x.price-x.received),0))}</b></button></div>`}
function actionButtons(type,id){return `<div class="table-actions"><button data-action="edit" data-type="${type}" data-id="${id}" title="Editar">Editar</button><button data-action="delete" data-type="${type}" data-id="${id}" title="Excluir">Excluir</button></div>`}
function debtsPage(){const total=db.debts.reduce((s,d)=>s+d.total,0),paid=db.debts.reduce((s,d)=>s+d.paid,0),left=total-paid;return `${header('Minhas dívidas','Tudo o que você precisa pagar, organizado em um só lugar.','debt','Nova dívida')}<div class="grid stats-grid">${stat('Valor original',total,'↘')}${stat('Já pago',paid,'✓')}${stat('Falta pagar',left,'◷')}${stat('Dívidas em aberto',db.debts.filter(d=>d.paid<d.total).length,'≡','Registros pendentes')}</div><div class="card" style="margin-top:18px"><div class="page-tools"><input class="search-input" id="debtSearch" placeholder="Buscar pessoa ou motivo..." style="max-width:360px"><select id="debtFilter" class="search-input" style="max-width:200px"><option value="">Todos os status</option><option>Pendente</option><option>Parcialmente paga</option><option>Quitada</option><option>Atrasada</option></select></div><div id="debtTable"></div></div>`}
function receivablesPage(){const total=db.receivables.reduce((s,r)=>s+r.total,0),got=db.receivables.reduce((s,r)=>s+r.received,0),left=total-got;return `${header('Dinheiro a receber','Empréstimos e valores que outras pessoas precisam devolver.','receivable','Registrar valor')}<div class="grid stats-grid">${stat('Total emprestado',total,'↗')}${stat('Já recebido',got,'✓')}${stat('Falta receber',left,'◷')}${stat('Pessoas em aberto',db.receivables.filter(r=>r.received<r.total).length,'♙')}</div><div class="card" style="margin-top:18px"><div class="page-tools"><input class="search-input" id="recSearch" placeholder="Buscar pessoa..." style="max-width:360px"><select id="recFilter" class="search-input" style="max-width:210px"><option value="">Todos os status</option><option>A receber</option><option>Parcialmente recebido</option><option>Recebido</option><option>Atrasado</option></select></div><div id="recTable"></div></div>`}
function salesPage(){const price=db.sales.filter(s=>s.status!=='cancelled').reduce((a,s)=>a+s.price,0),got=db.sales.reduce((a,s)=>a+s.received,0),cost=db.sales.reduce((a,s)=>a+s.cost,0);return `${header('Minhas vendas','Registre seus produtos e acompanhe o dinheiro que realmente entrou.','sale','Nova venda')}<div class="grid stats-grid">${stat('Valor das vendas',price,'◇')}${stat('Recebido',got,'✓')}${stat('Falta receber',Math.max(0,price-got),'◷')}${stat('Lucro estimado',price-cost,'✧','Receita menos custo registrado')}</div><div class="card" style="margin-top:18px"><div class="page-tools"><input class="search-input" id="saleSearch" placeholder="Buscar produto ou comprador..." style="max-width:360px"><select class="search-input" id="saleFilter" style="max-width:210px"><option value="">Todos os status</option><option>Anunciado</option><option>Vendido e não recebido</option><option>Parcialmente recebido</option><option>Pago</option><option>Cancelado</option></select></div><div id="saleTable"></div></div>`}
function vaultPage(){return `${header('Meu cofrinho','Seu dinheiro guardado, com histórico de cada movimento.')}<div class="cofre-hero"><div class="safe-illustration">▣</div><div><div class="eyebrow">TOTAL GUARDADO</div><div class="cofre-total">${moneyView(db.vault.balance)}</div><p class="muted small" style="margin:0">Dinheiro reservado e separado do saldo livre.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-primary btn-small" data-action="vaultAdd">＋ Adicionar dinheiro</button><button class="btn btn-outline btn-small" data-action="vaultTake">↗ Retirar dinheiro</button></div></div></div>${header('Histórico do cofrinho','Depósitos e retiradas registrados.')}<div class="card">${db.vault.history.length?`<div class="list">${[...db.vault.history].sort((a,b)=>b.date.localeCompare(a.date)).map(h=>row(h.type==='deposit'?'＋':'↗',h.description|| (h.type==='deposit'?'Depósito':'Retirada'),fmtDate(h.date),h.amount,h.type==='deposit'?'out':'in')).join('')}</div>`:empty('▣','Seu cofrinho está esperando','Registre sua primeira transferência para começar a guardar.','vaultAdd','Guardar dinheiro')}</div>`}
function goalsPage(){return `${header('Minhas metas','Dê um nome aos seus planos e acompanhe cada conquista.','goal','Nova meta')}${db.goals.length?`<div class="grid goal-grid">${db.goals.map(g=>`<div class="card goal-card"><div class="goal-color" style="background:${safe(g.color||'#4779b8')}"></div><div style="display:flex;justify-content:space-between;align-items:start;gap:10px"><div><h3>${safe(g.name)}</h3><div class="small muted" style="margin-top:6px">${safe(g.description||'Meta pessoal')}${g.date?' · Até '+fmtDate(g.date):''}</div></div>${pill(g.saved>=g.target?'Concluída':g.paused?'Pausada':'Em andamento')}</div><div class="goal-amount">${moneyView(g.saved)}</div><div class="small muted">de ${moneyView(g.target)}</div><div class="progress"><span style="width:${Math.min(100,g.target?g.saved/g.target*100:0)}%;background:${safe(g.color||'#4779b8')}"></span></div><div class="goal-foot"><span>${moneyView(Math.max(0,g.target-g.saved))} restantes</span><strong>${g.target?Math.min(100,(g.saved/g.target*100)).toFixed(1).replace('.',','):0}%</strong></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:17px"><button class="btn btn-primary btn-small" data-action="goalAdd" data-id="${g.id}">＋ Adicionar</button><button class="btn btn-soft btn-small" data-action="goalTake" data-id="${g.id}">Retirar</button><button class="btn btn-outline btn-small" data-action="edit" data-type="goal" data-id="${g.id}">Editar</button><button class="btn btn-outline btn-small" data-action="delete" data-type="goal" data-id="${g.id}">×</button></div>${g.saved>=g.target?'<p class="small positive" style="margin-bottom:0">✦ Meta alcançada! Parabéns pela conquista.</p>':''}</div>`).join('')}</div>`: `<div class="card">${empty('◎','Qual é o seu próximo sonho?','Crie uma meta personalizada e acompanhe o dinheiro reservado para ela.','goal','Criar minha primeira meta')}</div>`}`}
function transactionsPage(){return `${header('Movimentações','Entradas, despesas e operações registradas.','transaction','Nova movimentação')}<div class="card"><div class="page-tools"><input id="txSearch" class="search-input" placeholder="Buscar descrição ou categoria..." style="max-width:300px"><select id="txType" class="search-input" style="max-width:150px"><option value="">Entradas e saídas</option><option value="in">Entradas</option><option value="out">Despesas</option></select><input id="txFrom" type="date" class="search-input" style="max-width:160px"><input id="txTo" type="date" class="search-input" style="max-width:160px"></div><div id="txTable"></div></div>`}
function summaryPage(){const m=activeMonth,txIn=db.transactions.filter(t=>t.type==='in'&&!t.internal&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0)+db.receivables.reduce((s,r)=>s+(r.payments||[]).filter(p=>p.date.startsWith(m)).reduce((a,p)=>a+p.amount,0),0)+db.sales.reduce((s,x)=>s+(x.payments||[]).filter(p=>p.date.startsWith(m)).reduce((a,p)=>a+p.amount,0),0),txOut=db.transactions.filter(t=>t.type==='out'&&!t.internal&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0)+db.debts.reduce((s,d)=>s+(d.payments||[]).filter(p=>p.date.startsWith(m)).reduce((a,p)=>a+p.amount,0),0),has=txIn||txOut;let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=d.toISOString().slice(0,7);let inc=db.transactions.filter(t=>t.type==='in'&&!t.internal&&t.date.startsWith(key)).reduce((s,t)=>s+t.amount,0)+db.receivables.reduce((s,r)=>s+(r.payments||[]).filter(p=>p.date.startsWith(key)).reduce((a,p)=>a+p.amount,0),0)+db.sales.reduce((s,x)=>s+(x.payments||[]).filter(p=>p.date.startsWith(key)).reduce((a,p)=>a+p.amount,0),0);let out=db.transactions.filter(t=>t.type==='out'&&!t.internal&&t.date.startsWith(key)).reduce((s,t)=>s+t.amount,0)+db.debts.reduce((s,d)=>s+(d.payments||[]).filter(p=>p.date.startsWith(key)).reduce((a,p)=>a+p.amount,0),0);months.push({key,label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),inc,out})}let max=Math.max(1,...months.flatMap(x=>[x.inc,x.out]));return `${header('Resumo financeiro','Dados reais dos registros que você cadastrou.')}<div class="page-tools"><div class="month-picker"><label class="small muted">Período</label><input type="month" class="search-input" id="activeMonth" value="${m}" style="width:auto"></div></div><div class="grid stats-grid">${stat('Dinheiro recebido',txIn,'↗')}${stat('Despesas pagas',txOut,'↘')}${stat('Dinheiro guardado',db.vault.balance+reservedGoals(),'▣')}${stat('Saldo disponível',available(),'◉')}</div><div class="grid two-col" style="margin-top:18px"><section class="card"><h3>Entradas x saídas</h3><p class="muted small">Últimos seis meses · valores registrados</p><div class="legend" style="margin-top:14px"><span><i style="background:#4b8a70"></i>Entradas</span><span><i style="background:#8a9fbd"></i>Saídas</span></div><div class="chart-bars">${months.map(x=>`<div class="bar-col"><div class="bar-pair"><div class="bar in" title="Entradas ${money(x.inc)}" style="height:${x.inc?Math.max(3,x.inc/max*100):1}%"></div><div class="bar out" title="Saídas ${money(x.out)}" style="height:${x.out?Math.max(3,x.out/max*100):1}%"></div></div><div class="bar-label">${safe(x.label)}</div></div>`).join('')}</div></section><section class="card"><h3>Resumo do período</h3><p class="muted small">${new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</p>${header('Entradas efetivas',moneyView(txIn))}<div class="progress"><span style="width:${txIn+txOut?txIn/(txIn+txOut)*100:0}%;background:#4b8a70"></span></div>${header('Despesas efetivamente pagas',moneyView(txOut))}<div class="progress"><span style="width:${txIn+txOut?txOut/(txIn+txOut)*100:0}%;background:#8a9fbd"></span></div><div class="notice" style="margin-top:15px;margin-bottom:0">Transferências para o cofrinho e metas não são tratadas como receita ou despesa.</div></section></div><div class="grid stats-grid" style="margin-top:18px">${stat('Dívidas pendentes',totals().debts,'↘')}${stat('Valores a receber',totals().receivable,'↗')}${stat('Cofrinho',db.vault.balance,'▣')}${stat('Reservado nas metas',reservedGoals(),'◎')}</div>${!has?`<div class="card" style="margin-top:18px">${empty('▥','Seu resumo vai aparecer aqui','Registre entradas e despesas reais para visualizar a evolução financeira.')}</div>`:''}`}
function calendarPage(){let ev=[];db.debts.filter(d=>d.paid<d.total&&d.due).forEach(d=>ev.push({date:d.due,title:'Pagar: '+d.person,sub:d.description||'Dívida',amount:d.total-d.paid,type:'out'}));db.receivables.filter(r=>r.received<r.total&&r.due).forEach(r=>ev.push({date:r.due,title:'Receber: '+r.person,sub:r.description||'Valor a receber',amount:r.total-r.received,type:'in'}));db.sales.filter(s=>s.received<s.price&&s.status!=='cancelled'&&s.date).forEach(s=>ev.push({date:s.due||s.date,title:'Receber venda: '+s.product,sub:s.buyer||'Venda',amount:s.price-s.received,type:'in'}));db.goals.filter(g=>g.date&&g.saved<g.target).forEach(g=>ev.push({date:g.date,title:'Meta: '+g.name,sub:'Data desejada',amount:g.target-g.saved,type:'goal'}));ev.sort((a,b)=>a.date.localeCompare(b.date));return `${header('Calendário financeiro','Vencimentos e datas importantes dos seus registros.')}<div class="grid two-col"><section class="card"><h3>Próximos compromissos</h3><p class="muted small">Em ordem cronológica</p><div class="calendar-list" style="margin-top:15px">${ev.length?ev.map(e=>`<div class="calendar-item ${e.date<today()?'overdue':e.date<=new Date(Date.now()+7*86400000).toISOString().slice(0,10)?'due-soon':''}"><div class="date-box"><strong>${e.date.slice(8,10)}</strong><span>${new Date(e.date+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</span></div><div class="row-main"><div class="row-title">${safe(e.title)}</div><div class="row-sub">${fmtDate(e.date)} · ${safe(e.sub)}</div></div><div class="row-value ${e.type==='out'?'negative':e.type==='in'?'positive':''}">${moneyView(e.amount)}${e.date<today()?'<div>'+pill('Atrasado')+'</div>':''}</div></div>`).join(''):empty('▦','Nenhum compromisso cadastrado','Datas de dívidas, recebimentos e metas aparecerão aqui.')}</div></section><section class="card"><h3>Como funciona</h3><p class="muted small" style="line-height:1.7">O calendário usa as datas que você informa nas dívidas, valores a receber, vendas e metas. Para concluir um compromisso financeiro, registre o pagamento ou recebimento na área correspondente — assim os saldos continuam corretos.</p><button class="btn btn-soft" data-page="debts">Ver minhas dívidas</button> <button class="btn btn-soft" data-page="receivables">Ver recebimentos</button></section></div>`}
function profilePage(){return `<div class="card" style="max-width:700px"><div class="profile-preview"><img class="avatar" style="width:62px;height:62px" src="${db.profile.avatar||avatarPlaceholder()}" alt="Foto de perfil"><div><h3>${safe(db.profile.name)}</h3><p class="muted small">Personalize seu espaço RIBEIRO.</p></div></div><form id="profileForm"><div class="field"><label for="profileName">Nome exibido</label><input id="profileName" name="name" maxlength="60" value="${safe(db.profile.name)}" required></div><div class="field"><label>Foto de perfil</label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-soft" type="button" id="chooseAvatar">Escolher da galeria</button><button class="btn btn-outline" type="button" id="removeAvatar">Remover foto</button></div><p class="small muted">A imagem é reduzida para economizar espaço no armazenamento local do navegador.</p></div><button class="btn btn-primary">Salvar perfil</button></form></div>`}

function openGoal(x=null){modal(x?'Editar meta':'Criar meta financeira',formWrap(field('Nome da meta','name','text',x?.name||'',{required:true})+field('Valor desejado (R$)','target','number',x?(x.target/100).toFixed(2):'',{required:true,min:'0.01',step:'0.01'})+field('Valor inicial reservado (R$)','saved','number',x?(x.saved/100).toFixed(2):'0',{required:true,min:'0',step:'0.01'})+field('Data desejada','date','date',x?.date||'')+field('Cor da meta','color','select',x?.color||'#4779b8',{options:['#4779b8','#39785a','#6b8fc2','#315d94','#4779b8','#9bb6da']})+field('Descrição','description','textarea',x?.description||'',{full:true})),x?'Salvar alterações':'Criar meta',fd=>{let target=toCents(fd.get('target')),saved=toCents(fd.get('saved'));if(target<=0||saved<0){notify('Informe valores válidos.');return}if(x&&saved>x.saved&&saved-x.saved>available()){notify('Saldo disponível insuficiente para reservar esse valor.');return}if(!x&&saved>available()){notify('Saldo disponível insuficiente para o valor inicial.');return}const item={id:x?.id||uid(),name:fd.get('name').trim(),target,saved,date:fd.get('date'),color:fd.get('color'),description:fd.get('description'),paused:x?.paused||false,history:x?.history||[]};if(!x&&saved>0)item.history.push({id:uid(),type:'add',amount:saved,date:today()});if(x&&saved!==x.saved)item.history.push({id:uid(),type:saved>x.saved?'add':'withdraw',amount:Math.abs(saved-x.saved),date:today()});if(x)db.goals=db.goals.map(g=>g.id===x.id?item:g);else db.goals.push(item);save();closeModal();render();notify(x?'Meta atualizada.':'Meta criada!')});hookCancel()}
function openGoalTransfer(id,type){let g=db.goals.find(g=>g.id===id);if(!g)return;modal(type==='add'?'Adicionar dinheiro à meta':'Retirar dinheiro da meta',formWrap(field('Meta','goalName','text',g.name,{required:true})+field('Valor (R$)','amount','number','',{required:true,min:'0.01',step:'0.01'})+field('Data','date','date',today(),{required:true})+field('Descrição','description','text','')),type==='add'?'Reservar dinheiro':'Retirar da meta',fd=>{let amount=toCents(fd.get('amount'));if(amount<=0){notify('Informe um valor válido.');return}if(type==='add'&&available()<amount){notify('Saldo disponível insuficiente para essa meta.');return}if(type==='withdraw'&&g.saved<amount){notify('A meta não tem esse valor reservado.');return}g.saved+=type==='add'?amount:-amount;g.history.push({id:uid(),type,amount,date:fd.get('date'),description:fd.get('description')});save();closeModal();render();notify(type==='add'?'Sua meta foi atualizada.':'Valor devolvido ao saldo disponível.')});hookCancel()}
function openPayment(kind,id){let obj=kind==='debt'?db.debts.find(x=>x.id===id):kind==='receivable'?db.receivables.find(x=>x.id===id):db.sales.find(x=>x.id===id);if(!obj)return;let remaining=kind==='debt'?obj.total-obj.paid:kind==='receivable'?obj.total-obj.received:obj.price-obj.received;let name=kind==='debt'?obj.person:kind==='receivable'?obj.person:obj.product;modal(kind==='debt'?'Registrar pagamento':kind==='receivable'?'Registrar recebimento':'Receber pagamento da venda',`<div class="notice">${safe(name)} · Restante: <strong>${money(remaining)}</strong></div>`+formWrap(field('Valor (R$)','amount','number','',{required:true,min:'0.01',step:'0.01'})+field('Data','date','date',today(),{required:true})+field('Observação','notes','text','')),kind==='debt'?'Registrar pagamento':'Registrar recebimento',fd=>{let amount=toCents(fd.get('amount'));if(amount<=0||amount>remaining){notify('O valor deve ser maior que zero e não pode ultrapassar o restante.');return}if(kind==='debt'&&available()<amount){notify('Saldo disponível insuficiente para pagar essa dívida.');return}let p={id:uid(),amount,date:fd.get('date'),notes:fd.get('notes')};if(kind==='debt'){obj.paid+=amount;obj.payments.push(p)}else if(kind==='receivable'){obj.received+=amount;obj.payments.push(p)}else{obj.received+=amount;obj.payments.push(p)}save();closeModal();render();notify(kind==='debt'?'Pagamento registrado.':'Recebimento registrado!')});hookCancel()}
function editRecord(type,id){if(type==='transaction'){let x=db.transactions.find(x=>x.id===id);if(x)openTransaction(x.type,x)}if(type==='debts'){let x=db.debts.find(x=>x.id===id);if(x)openDebt(x)}if(type==='receivables'){let x=db.receivables.find(x=>x.id===id);if(x)openReceivable(x)}if(type==='sales'){let x=db.sales.find(x=>x.id===id);if(x)openSale(x)}if(type==='goal'){let x=db.goals.find(x=>x.id===id);if(x)openGoal(x)}}
function deleteRecord(type,id){if(!confirm('Tem certeza de que deseja excluir este registro? Essa ação pode alterar seus saldos.'))return;if(type==='transaction'){const t=db.transactions.find(t=>t.id===id);if(t?.internal){notify('Para manter o histórico consistente, estorne a transferência pelo cofrinho.');return}db.transactions=db.transactions.filter(t=>t.id!==id)}if(type==='debts')db.debts=db.debts.filter(x=>x.id!==id);if(type==='receivables')db.receivables=db.receivables.filter(x=>x.id!==id);if(type==='sales')db.sales=db.sales.filter(x=>x.id!==id);if(type==='goal'){let g=db.goals.find(x=>x.id===id);if(g?.saved&&!confirm(`Esta meta possui ${money(g.saved)} reservados. Deseja devolver esse valor ao saldo disponível antes de excluir?`))return;db.goals=db.goals.filter(x=>x.id!==id)}save();render();notify('Registro excluído.')}
function openMore(){go('profile')}
function exportJson(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'ribeiro-backup-'+today()+'.json');notify('Backup exportado.')}
function exportCsv(){const rows=[['tipo','descricao','valor_centavos','data','categoria','observacoes']];db.transactions.forEach(t=>rows.push([t.type,t.description,t.amount,t.date,t.category,t.notes||'']));const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'ribeiro-movimentacoes-'+today()+'.csv');notify('CSV exportado.')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJson(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||!Array.isArray(parsed.transactions)||!Array.isArray(parsed.debts)||!parsed.vault)throw Error();if(!confirm('Importar este backup substituirá os dados atuais. Deseja continuar?'))return;db={...blank(),...parsed};save();go('home');notify('Backup importado com sucesso.')}catch(err){notify('Arquivo inválido ou incompatível. Nenhum dado foi alterado.')}e.target.value=''};reader.readAsText(file)}
function resetData(){if(confirm('Apagar permanentemente todos os dados salvos neste navegador?')){localStorage.removeItem(KEY);db=blank();save();go('home');notify('Dados apagados. O RIBEIRO foi reiniciado.')}}
function compressImage(file,cb){const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=480,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);cb(canvas.toDataURL('image/jpeg',.78))};img.onerror=()=>notify('Não foi possível abrir essa imagem.');img.src=reader.result};reader.readAsDataURL(file)}
$('#avatarFile').onchange=e=>{const f=e.target.files[0];if(f){compressImage(f,url=>{db.profile.avatar=url;save();render();notify('Foto de perfil atualizada!')})}e.target.value=''};
$('#productFile').onchange=e=>{const f=e.target.files[0];if(f){compressImage(f,url=>{tempProductImage=url;const label=$('#chooseProduct')?.parentElement?.querySelector('span');if(label)label.textContent='Foto adicionada'})}e.target.value=''};
$('#profileBtn').onclick=()=>go('profile');$('#settingsBtn').onclick=()=>go('settings');
function init(){nav();render()}
init();
